# Configuration MySQL - À utiliser quand MySQL est configuré
# Renommez ce fichier en "application.properties" pour l'utiliser

hibernate.connection.driver_class=com.mysql.cj.jdbc.Driver
hibernate.connection.url=jdbc:mysql://localhost:3306/exercice1_db?allowPublicKeyRetrieval=true&useSSL=false
hibernate.connection.username=root
hibernate.connection.password=

# Si vous utilisez MAMP, le port peut être 8889 :
# hibernate.connection.url=jdbc:mysql://localhost:8889/exercice1_db?allowPublicKeyRetrieval=true&useSSL=false

# Si vous avez un mot de passe MySQL :
# hibernate.connection.password=VOTRE_MOT_DE_PASSE

# Hibernate Configuration
hibernate.dialect=org.hibernate.dialect.MySQLDialect
hibernate.show_sql=true
hibernate.format_sql=true
hibernate.hbm2ddl.auto=update

# Connection Pool Settings
hibernate.connection.pool_size=10

